<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="100%" stop-color="#764ba2" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e" />
      <stop offset="100%" stop-color="#ff6b8b" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />

  <!-- Open Gratitude Journal Pages -->
  <path
    d="M14 24c0-2.2 1.8-4 4-4h9c2.8 0 5 2.2 5 5v23c-1.5-1.3-3.5-2-5.8-2H18c-2.2 0-4-1.8-4-4V24z"
    fill="#ffffff"
    opacity="0.95"
  />
  <path
    d="M50 24c0-2.2-1.8-4-4-4h-9c-2.8 0-5 2.2-5 5v23c1.5-1.3 3.5-2 5.8-2H46c2.2 0 4-1.8 4-4V24z"
    fill="#f3f4ff"
    opacity="0.95"
  />
  <!-- Center Spine Line -->
  <line x1="32" y1="24" x2="32" y2="48" stroke="#667eea" stroke-width="1.8" stroke-linecap="round" opacity="0.45" />

  <!-- Subtle Journal Lines on Left & Right Pages -->
  <line x1="18" y1="33" x2="27" y2="33" stroke="#667eea" stroke-width="2" stroke-linecap="round" opacity="0.35" />
  <line x1="18" y1="38" x2="26" y2="38" stroke="#667eea" stroke-width="2" stroke-linecap="round" opacity="0.35" />
  <line x1="37" y1="33" x2="46" y2="33" stroke="#764ba2" stroke-width="2" stroke-linecap="round" opacity="0.35" />
  <line x1="38" y1="38" x2="46" y2="38" stroke="#764ba2" stroke-width="2" stroke-linecap="round" opacity="0.35" />

  <!-- Glowing Gratitude Heart Floating Above Journal -->
  <path
    d="M32 30.5c-1.2-1.1-7.5-5.6-7.5-10.3 0-2.9 2.3-5.2 5.1-5.2 1.6 0 3.1.8 3.9 2 .8-1.2 2.3-2 3.9-2 2.8 0 5.1 2.3 5.1 5.2 0 4.7-6.3 9.2-7.5 10.3-.8.7-2.2.7-3 0z"
    fill="url(#heartGrad)"
    stroke="#ffffff"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Warm Sparkle Accents -->
  <path d="M48 13l1.2 2.8L52 17l-2.8 1.2L48 21l-1.2-2.8L44 17l2.8-1.2z" fill="#ffe082" />
  <circle cx="16" cy="15" r="2" fill="#ffe082" opacity="0.9" />
</svg>
